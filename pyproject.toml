[project]
name = "luban-skills-workspace"
version = "1.3.0"
description = "Open-source workspace for luban-skills, demo assets, and share artifacts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["luban-skills/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
